name: EMS Application CI/CD 

on: 
  push:
    tags:
      - "v*"

permissions:
  contents: read 
  id-token: write 

env:
  AWS_REGION: ap-south-1 
  ENVIRONMENT: dev 
  BACKEND_S3_BUCKET: ems-dev-artifacts-2026
  FRONTEND_S3_BUCKET: ems-dev-ems-bucket
  SSM_PARAMETER: /app/ems-dev/backend/current-version

jobs:
  # ============================================================
  # CI
  # Build, test, package and publish artifact
  # ============================================================

  ci:
    name: CI - Build and Publish 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code 
        uses: actions/checkout@v4 

      # -------------------------------
      # Backend
      # -------------------------------

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm 
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json


      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci 

      - name: Test backend
        working-directory: backend
        run: npm run test --if-present

      - name: Get application version
        run: |
          VERSION="${GITHUB_REF_NAME}"

          echo "Application version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create backend deployment package
        working-directory: backend
        run: |
          zip -r "../employee-backend-${VERSION}.zip" . \
            -x "node_modules/*" \
              ".env" \
              "*.log" \
              "Dockerfile" \
              ".dockerignore"
        
      
      # -------------------------------
      # Frontend
      # -------------------------------

      - name: Check Frontend package-lock.json
        working-directory: frontend
        run: |
          cat package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install 

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watchAll=false 

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify deployment package
        run: |
          echo "Backend: "
          ls -lh "employee-backend-${VERSION}.zip"
          unzip -l "employee-backend-${VERSION}.zip" | head -30

          echo "Frontend: "
          ls -lah frontend/build


      # -------------------------------
      # AWS Authentication
      # -------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity 


      # -------------------------------
      # Publish artifacts
      # -------------------------------

      - name: Upload backend artifact to S3
        run: |
          aws s3 cp \
            "employee-backend-${VERSION}.zip" \
            "s3://${BACKEND_S3_BUCKET}/backend/employee-backend-${VERSION}.zip" \
            --region "${AWS_REGION}"

      - name: Upload frontend build
        run: |
          aws s3 sync \
            frontend/build/ \
            "s3://${FRONTEND_S3_BUCKET}/" \
            --region "${AWS_REGION}"

      
      # -------------------------------
      # Verify artifacts
      # -------------------------------

      - name: Verify backend artifact 
        run: |
          aws s3 ls \
          "s3://${BACKEND_S3_BUCKET}/backend/" \
          --region "${AWS_REGION}"

      - name: Verify frontend artifact 
        run: |
          aws s3 ls \
          "s3://${FRONTEND_S3_BUCKET}/" \
          --region "${AWS_REGION}"