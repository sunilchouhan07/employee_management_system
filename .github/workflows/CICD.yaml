name: EMS Application CI/CD 

on: 
  push:
    tags:
      - "v*"

permissions:
  contents: read 
  id-token: write 

env:
  AWS_REGION: ap-south-1 
  PROJECT: ems
  ENVIRONMENT: dev 
  BACKEND_S3_BUCKET: ems-dev-artifacts-2026
  FRONTEND_S3_BUCKET: ems-dev-ems-bucket
  SSM_PARAMETER: /app/ems-dev/backend/current-version

jobs:
  # ============================================================
  # CI
  # Build, test, package and publish artifact
  # ============================================================

  ci:
    name: CI - Build and Publish 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code 
        uses: actions/checkout@v4 

      # -------------------------------
      # Backend
      # -------------------------------

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm 
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json


      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci 

      - name: Test backend
        working-directory: backend
        run: npm run test --if-present

      - name: Get application version
        run: |
          VERSION="${GITHUB_REF_NAME}"

          echo "Application version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create backend deployment package
        working-directory: backend
        run: |
          zip -r "../employee-backend-${VERSION}.zip" . \
            -x "node_modules/*" \
              ".env" \
              "*.log" \
              "Dockerfile" \
              ".dockerignore"
        
      
      # -------------------------------
      # Frontend
      # -------------------------------

      - name: Check Frontend package-lock.json
        working-directory: frontend
        run: |
          cat package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install 

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify deployment package
        run: |
          echo "Backend: "
          ls -lh "employee-backend-${VERSION}.zip"
          unzip -l "employee-backend-${VERSION}.zip" | head -30

          echo "Frontend: "
          ls -lah frontend/build


      # -------------------------------
      # AWS Authentication
      # -------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity 


      # -------------------------------
      # Publish artifacts
      # -------------------------------

      - name: Upload backend artifact to S3
        run: |
          aws s3 cp \
            "employee-backend-${VERSION}.zip" \
            "s3://${BACKEND_S3_BUCKET}/backend/employee-backend-${VERSION}.zip" \
            --region "${AWS_REGION}"

      - name: Upload frontend build
        run: |
          aws s3 sync \
            frontend/build/ \
            "s3://${FRONTEND_S3_BUCKET}/" \
            --region "${AWS_REGION}"

      
      # -------------------------------
      # Verify artifacts
      # -------------------------------

      - name: Verify backend artifact 
        run: |
          aws s3 ls \
          "s3://${BACKEND_S3_BUCKET}/backend/" \
          --region "${AWS_REGION}"

      - name: Verify frontend artifact 
        run: |
          aws s3 ls \
          "s3://${FRONTEND_S3_BUCKET}/" \
          --region "${AWS_REGION}"

  
  CD:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get application version
        run: |
          VERSION="${GITHUB_REF_NAME}"

          echo "Application version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Update current application version
        run: |
          aws ssm put-parameter \
            --name "${SSM_PARAMETER}" \
            --value "${VERSION}" \
            --type String \
            --overwrite \
            --region "${AWS_REGION}"

      - name: Deploy backend to EC2
        run: |

          DEPLOY_COMMAND="sudo /opt/employee-app/scripts/deploy.sh ${PROJECT} employee-backend-${VERSION}.zip ${VERSION} ${BACKEND_S3_BUCKET} ${ENVIRONMENT} ${AWS_REGION}"

          echo "Deployment command:"
          echo "${DEPLOY_COMMAND}"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=${PROJECT}" \
                      "Key=tag:Environment,Values=${ENVIRONMENT}" \
                      "Key=tag:Role,Values=application-server" \
            --parameters "commands=[\"${DEPLOY_COMMAND}\"]" \
            --comment "EMS backend deployment ${VERSION}" \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: Monitor deployment
        run: |

          echo "Waiting for EC2 deployment..."

          for i in {1..30}; do

            echo "Checking deployment status... attempt ${i}/30"

            STATUS=$(aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --details \
              --region "${AWS_REGION}" \
              --query "CommandInvocations[].Status" \
              --output text)

            echo "Current status:"
            echo "${STATUS}"

            if echo "${STATUS}" | grep -q "Failed"; then
              echo "❌ Deployment failed"
              exit 1
            fi

            if echo "${STATUS}" | grep -q "Cancelled"; then
              echo "❌ Deployment cancelled"
              exit 1
            fi

            if echo "${STATUS}" | grep -q "TimedOut"; then
              echo "❌ Deployment timed out"
              exit 1
            fi

            if [ -n "${STATUS}" ] && \
               ! echo "${STATUS}" | grep -Eq "Pending|InProgress|Delayed"; then

              echo "✅ Deployment completed successfully"
              exit 0
            fi

            sleep 10

          done

          echo "❌ Deployment did not complete within expected time"
          exit 1